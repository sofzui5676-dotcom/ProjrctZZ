<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер привычек</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="public/manifest.json">
    <link rel="apple-touch-icon" href="public/192.png">
    <meta name="theme-color" content="#e8d5d5">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Мои привычки</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему"></button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="profile">Профиль</button>
            <button class="tab-btn" data-tab="habits">Привычки</button>
            <button class="tab-btn" data-tab="stats">Статистика</button>
        </div>

        <!-- Вкладка Профиль -->
        <div id="profile" class="tab-content active">
            <div class="profile-view" id="profileView">
                <div class="profile-card">
                    <div class="profile-avatar" id="profileAvatar">
                        <div class="avatar-placeholder" id="avatarPlaceholder">
                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <img id="profileAvatarImg" class="avatar-image" style="display: none;">
                    </div>
                    <div class="profile-info">
                        <h3 id="displayName">Не указано</h3>
                        <p id="displayAgeGender"></p>
                    </div>
                    <button class="edit-profile-btn" id="editProfileBtn">Редактировать</button>
                </div>
            </div>

            <div class="profile-edit hidden" id="profileEdit">
                <form id="profileForm" class="profile-form">
                    <div class="form-group">
                        <label for="name">Имя</label>
                        <input type="text" id="name" placeholder="Ваше имя" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="age">Возраст</label>
                        <input type="number" id="age" placeholder="Возраст" min="1" max="120" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Пол</label>
                        <select id="gender" required>
                            <option value="">Выберите</option>
                            <option value="male">Мужской</option>
                            <option value="female">Женский</option>
                            <option value="other">Другой</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Фото профиля</label>
                        <div class="photo-upload-area">
                            <div class="photo-preview" id="photoPreview">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                                <span>Загрузить фото</span>
                            </div>
                            <input type="file" id="photoUpload" accept="image/*" style="display: none;">
                            <button type="button" class="remove-photo-btn hidden" id="removePhoto">Удалить фото</button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Сохранить</button>
                        <button type="button" class="btn-secondary" id="cancelEditBtn">Отмена</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Вкладка Привычки -->
        <div id="habits" class="tab-content">
            <div class="habits-list" id="habitsList"></div>
            
            <div class="add-habit">
                <input type="text" id="newHabitName" placeholder="Новая привычка" maxlength="50">
                <button id="addHabit">Добавить</button>
            </div>

            <div class="date-selector">
                <label>Выберите день:</label>
                <input type="date" id="selectedDate">
            </div>
        </div>

        <!-- Вкладка Статистика -->
        <div id="stats" class="tab-content">
            <div class="stats-container">
                <h3>Недельная статистика</h3>
                <div id="weeklyStats"></div>
                
                <h4>Прогресс привычек</h4>
                <div id="habitProgress"></div>
            </div>

            <div class="stats-container">
                <h3>Статистика за день</h3>
                <div class="date-selector">
                    <input type="date" id="statsDate">
                    <button id="showDayStats">Показать</button>
                </div>
                <div id="dayStats"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('public/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.log('Service Worker error:', err));
            });
        }
    </script>
</body>
</html>
